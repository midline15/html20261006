<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table, tr, td, th{
            border: 2px solid black;
            border-collapse: collapse;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div>
            <label>학번 : <input v-model="stuNo"></label>
        </div>
        <div>
            <label>이름 : <input v-model="name"></label>
        </div>
        <div>학과 : 
            <select v-model="dept">
                <option value="">:: 선택 ::</option>
                <option value="기계">기계</option>
                <option value="전기전자">전기전자</option>
                <option value="컴퓨터정보">컴퓨터정보</option>
            </select>
        </div>
        <div>
            성별 : 
            <label><input v-model="gender" value="M" type="radio" name="gender">남자</label>
            <label><input v-model="gender" value="F" type="radio" name="gender">여자</label>
        </div> 
        <div>
            <button @click="fnJoin">가입!</button>
        </div>
    </div>
</body>
</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                stuNo:'',
                name:'',
                dept:'',
                gender:''
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnJoin: function () {
                let self = this;
                let param={
                    stuNo: self.stuNo,
                    name: self.name,
                    dept: self.dept,
                    gender: self.gender
                }
                $.ajax({
                    url: "http://localhost:3000/join",
                    dataType: "json",
                    type: "GET",
                    data: param,
                    success: function (data) {
                        alert('가입 완료');
                        location.href='login.html';
                    }
                });
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        }
    });

    app.mount('#app');
</script>
