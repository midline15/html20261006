<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table,
        tr,
        td,
        th {
            border: 2px solid black;
            border-collapse: collapse;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div id="app">
        <div>
            학번<input type="text" v-model="stuNo" disabled="true">
        </div>
        <div>
            이름<input type="text" v-model="stuName">
        </div>
        <div>
            학과<input type="text" v-model="stuDept">
        </div>
        <div>
            <button @click="fnEdit">수정</button>
        </div>
    </div>
</body>

</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                stuNo: '',
                stuName: '',
                stuDept: ''
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnGetInfo: function () {
                let self = this;
                $.ajax({
                    url: "http://localhost:3000/search",
                    dataType: "json",
                    type: "GET",
                    data: {stuNo: self.stuNo},
                    success: function (data) {
                        console.log(data);
                        self.stuName = data.info.STU_NAME;
                        self.stuDept = data.info.STU_DEPT;
                    }
                });
            },
            fnEdit: function () {
                let self = this;
                let param = {
                    stuNo: self.stuNo,
                    name: self.stuName,
                    dept: self.stuDept
                }
                $.ajax({
                    url: "http://localhost:3000/update",
                    dataType: "json",
                    type: "GET",
                    data: param,
                    success: function (data) {
                        alert('수정되었습니다.');
                        location.href='student-list.html'
                    }
                });
            }
        }, // methods
        mounted() {
            let self = this;
            const queryParams = new URLSearchParams(window.location.search);
            self.stuNo = queryParams.get('stuNo') || '';
            self.fnGetInfo();
        }
    });

    app.mount('#app');
</script>
