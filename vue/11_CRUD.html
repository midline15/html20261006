<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table,
        tr,
        td,
        th {
            border: 2px solid black;
            border-collapse: collapse;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->
        <div id="create" v-if="kind == 'create'">
            <h3>게시글 등록</h3>
            <div>
                <label>제목 : <input v-model="title"></label>
            </div>
            <div>
                <label>내용 : <input v-model="contents"></label>
            </div>
            <div>
                <label>닉네임 : <input v-model="nickname"></label>
            </div>
            <div>
                <button @click="fnTest">등록!</button>
                <button @click="kind = 'board'">되돌아가기</button>
            </div>
        </div>

        <div v-if="kind == 'update'">
            <h3>게시글 수정</h3>
            <div>
                <label>제목 : <input v-model="title"></label>
            </div>
            <div>
                <label>내용 : <input v-model="contents"></label>
            </div>
            <div>
                <label>닉네임 : <input v-model="nickname"></label>
            </div>
            <div>
                <button @click="fnTest">수정!</button>
                <button @click="kind = 'board'">되돌아가기</button>
            </div>
        </div>

        <div id="board" v-else>
            <h3>게시글 목록</h3>
            <table>
                <tr>
                    <th>선택</th>
                    <th>번호</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>삭제</th>
                </tr>
                <tr v-for="item in list">
                    <td><input type="radio" v-model="boardNo" :value="item.boardNo" name="board"></td>
                    <td>{{item.boardNo}}</td>
                    <td>{{item.title}}</td>
                    <td>{{item.nickname}}</td>
                    <td>
                        <button @click="fnRemove(item.boardNo)">삭제</button>
                    </td>
                </tr>
            </table>
            <br>
            <button @click="kind = 'create'">게시글등록</button>
            <button @click="fnUpdateMenu(boardNo)">수정</button>
        </div>
    </div>
</body>

</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                kind: 'board',
                list: [
                    { boardNo: 1, title: '첫번째 게시글', contents: '1Qk~~~', nickname: '길똥' },
                    { boardNo: 2, title: '두번째 게시글', contents: '21435~~~', nickname: '찰스' }
                ],
                boardNo: '',
                title: '',
                contents: '',
                nickname: '',
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnRemove: function (boardNo) {
                let self = this;
                if (self.kind=='board' && !confirm('삭제?')) {
                    return;
                }
                if(self.kind=='update' && !confirm('수정?')){
                    return false;
                }
                for (let i = 0; i < self.list.length; i++) {
                    if (self.list[i].boardNo == boardNo) {
                        self.list.splice(i, 1);
                        break;
                    }
                }
                return true;
            },
            fnTest: function () {
                let self = this;
                if (self.boardNo == '') {
                    self.boardNo = self.list.length + 1;
                }
                let form = {
                    boardNo: self.boardNo,
                    title: self.title,
                    contents: self.contents,
                    nickname: self.nickname
                }
                if (self.kind == 'update' && !self.fnRemove(self.boardNo)) {
                    return;
                }
                self.list.push(form);
                
                self.title = '';
                self.contents = '';
                self.nickname = '';
                self.kind = 'board';
            },
            fnUpdateMenu(boardNo) {
                let self = this;
                if(self.boardNo == ''){
                    alert('수정할 게시글을 선택해주세요.');
                    return;
                }
                self.kind = 'update';
                for (let i = 0; i < self.list.length; i++) {
                    if (self.list[i].boardNo == boardNo) {
                        self.title = self.list[i].title;
                        self.contents = self.list[i].contents;
                        self.nickname = self.list[i].nickname;
                        break;
                    }

                }
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        }
    });

    app.mount('#app');
</script>
