<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->
         <div>
            숫자1: <input type="number" v-model="num1">
         </div>
         <div>
            숫자2: <input type="number" v-model="num2">
         </div>
         <button @click="fnSum">더하기</button>
         <button @click="fnInit">초기화</button>
         <hr>
         <div v-if="result != ''">{{'결과 : '+ result}}</div>
    </div>
</body>
</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                num1 : '',
                num2 : '',
                result : ''
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnSum: function () {
                let self = this;
                self.result = self.num1 + self.num2;
            },
            fnInit: function () {
                let self = this;
                self.num1 = '';
                self.num2 = '';
                self.result = '';
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        }
    });

    app.mount('#app');
</script>
