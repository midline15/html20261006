<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #title {
            color: blue;
        }

        .subject {
            color: green;
        }
        .core {
            background-color: gainsboro;
        }
    </style>   
    
</head>

<body>
    <!-- 태그에 직접적으로 스타일을 부여(인라인 스타일) 상황에 맞게 써야한다. -->
    <!-- 대부분의 경우 내부 스타일 시트나 외부 스타일 시트를 사용하는 것이 좋다. -->

    <!-- class, id 를 통해 스타일을 따로 부여하는게 가능 -->
    <!-- id는 중복x, class는 중복o -->

    <h3 id="title">과목 목록</h3>
    <ul>
        <li class="subject core"><span>자바</span></li>
        <li class="subject">오라클</li>
        <li class="subject core">HTML</li>
        <li class="subject"><span class="core">JavaScript</span></li>
    </ul>
    <hr>

    <h3>신청자 목록</h3>
    <ol>
        <li class="">홍길동</li>
        <li class="">김영희</li>
    </ol>
</body>

</html>
