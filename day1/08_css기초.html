<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>

    <style>
        p {
            color: blueviolet;
        }
    </style>
</head>

<body>
    <!-- css를 적용하는 방법은 크게 3가지 -->
    <!-- 1. 인라인 스타일 (Inline Style) -->
        <!-- 태그 안에 style 속성으로 정의하는 방법 -->
        <!-- 가장 쉽고 빠른 방법. 가독성이 안좋음 -->
        <!-- 남발하면 안좋다. 유지보수가 힘들다 -->
    <!-- 2. 내부 스타일 시트 (Internal Style Sheet) -->
        <!-- 헤드 태그 안에서 style 태그로 정의하는 방법 -->
        <!-- 재사용을 하지 않거나, 개별단위로 작업할 때 -->
        <!-- 화면단위(파일단위)로 학습하거나 화면별 통일성이 필요없을 때 -->
    <!-- 3. 외부 스타일 시트 (External Style Sheet) -->
        <!-- 확장자 .css 파일로 정의하고 html에서 참조(링크) -->
        <!-- 프로젝트 단위로 작업할 때 가장 많이 사용되는 방법 -->
        <!-- 화면별 공통성을 부여하기 위해 사용된다. -->

    <!-- 스타일이 적용되는 우선 순위는 1 > 2 > 3 -->
    <!-- td태그에 .css로 회색, head에서 노란색, 태그 내의 style로 오랜지색 작성하면 오렌지색 적용 -->
    
    <div>1번 스타일</div>
    <p>2번 스타일</p>
    <span style="color: orange;">3번 스타일</span>
    
    <div style="color: aqua;">HTML 재밌다</div>

</body>

</html>
