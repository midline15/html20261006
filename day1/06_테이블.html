<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블</title>
    <style>
        table, tr, th, td{
            border : 2px solid black; /* 2px 크기의 검은색 선(solid) */
            border-collapse : collapse; /* 테이블 선 겹치지 않게 */
            padding : 5px 10px; /* 위아래 5px, 좌우 10px */
            text-align : center; /* 글자 가운데 정렬 */    
        }
        th{
            background-color: beige; /* 헤더 배경색 */
        }
    </style>
</head>

<body>
    <!-- table : tr(행), th,td(열) 등으로 구성-->
    <table>
        <tr>
            <th>학번</th>
            <th>이름</th>
            <th>학과</th>
        </tr>
        <tr>
            <td>1234</td>
            <td>홍길동</td>
            <td>컴퓨터</td>
        </tr>
        <tr>
            <td>5678</td>
            <td>김철수</td>
            <td>전자</td>
        </tr>
    </table>
</body>

</html>
