<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- pre 태그 : 작성한 그대로 출력 -->
    <!-- 사용을 권장하지는 않음 -->
    <pre>
        Hello                   Html



        zzz             kfansd
    </pre>
    <!-- hr : 선 -->
    <hr>
    <!-- h1 ~ h6 : 타이틀에 많이 쓰는 태그 -->
    <!-- 숫자에 따라 크기가 다르고, 기본 볼드체 -->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>

    <hr>
    <!-- div, span -->
    <!-- div : 한 줄을 다 차지하는 태그(block 속성), p태그와 유사 -->
    <!-- span : 자신이 사용하는 만큼만 차지하는 태그(inline 속성) -->
    <span>html !!!</span>
    <span>재밌다 !!</span>

    <div>html !!!</div>
    <div>재밌다 <b>!!</b></div>

    <hr>

    <!-- b, strong : 텍스트를 굵게(볼드) -->
    <div>
        <b>b태그!!!</b>
    </div>
    <div>
        <!-- 시멘틱 태그 -->
        <strong>strong태그!!!</strong>
    </div>

    <hr>

    <!-- i, em : 이탤릭체 -->
    <div>
        <i>i태그 !!</i>
    </div>
    <div>
        <em>em태그 !!</em>
    </div>

    <hr>

    <!-- mark : 강조, 색상이 정해져 있고, 나중에 css로 대체 가능 -->
    <div>
        <mark>mark태그 !!</mark>
    </div>

    <hr>

    <!-- small : 텍스트를 작게 -->
    <div>
        <small>small태그 !!</small>
    </div>
    <div>
        <span style="font-size : 15px;">css로 글씨크기 적용!</span>
    </div>

    <hr>

    <div>
        HTML <sup>재밌다</sup>
    </div>
    <div>
        HTML <sub>재밌다</sub>
    </div>
    <div>
        HTML <del>재밌다</del>
    </div>
    <br><br><br><br><br> 
    <div>
        HTML <ins>재밌다</ins>
    </div>


    <div style="margin-bottom: 500px;"></div>
</body>

</html>
