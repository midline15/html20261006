<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, tr, th, td{
            border : 2px solid black; /* 2px 크기의 검은색 선(solid) */
            border-collapse : collapse; /* 테이블 선 겹치지 않게 */
            padding : 5px 10px; /* 위아래 5px, 좌우 10px */
            text-align : center; /* 글자 가운데 정렬 */    
        }
        th{
            background-color: #add8e6; /* 헤더 배경색 */
        }
    </style>   
</head>
<body>
    <table>
        <tr>
            <td colspan="2">1</td>
            <!-- <td>2</td> -->
            <td>3</td>
            <td>4</td>
        </tr>
        <tr>
            <td rowspan="2">5</td>
            <td>6</td>
            <td>7</td>
            <td>8</td>
        </tr>
        <tr>
            <!-- <td>9</td> -->
            <td>10</td>
            <td>11</td>
            <td>12</td>
        </tr>
        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
            <td>16</td>
        </tr>
    </table>
</body>
</html>
