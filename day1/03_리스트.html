<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리스트</title>
</head>

<body>
    <!-- 목록화 할 때 사용하는 태그(ol, ul) -->
    <!-- ul : 순서가 없는 목록 -->
    <ul>
        <li>자바</li>
        <li>오라클</li>
        <li>HTML</li>
    </ul>
    <hr>
    <!-- ol : 순서가 있는 목록 -->
    <!-- type 속성을 사용하여 순서의 형태를 지정할 수 있음 (1, A, a, I, i) -->
    <ol type="i" reversed>
        <li>자바</li>
        <li>오라클</li>
        <li>HTML</li>
    </ol>
    <hr>
</body>

</html>
