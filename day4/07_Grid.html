<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* grid-template-rows: 100px 200px; */
            grid-template-rows: repeat(4, 100px);
        }

        .box {
            border: 2px solid black;
            text-align: center;
            padding: 10px;
            font-size: 15px;
        }

        .blue-box {
            background-color: blue;
            grid-column: 1/-1;
            /* 1 2 3 4 or -4 -3 -2 -1*/

        }

        .red-box {
            background-color: red;
            grid-row: 2/4;
        }

        .orange-box {
            background-color: orange;
            grid-column: 2/4;
        }

        .purple-box {
            background-color: purple;

        }

        .green-box {
            background-color: green;

        }
    </style>
</head>

<body>
    <div id="container">
        <div class="box blue-box">box1</div>
        <div class="box red-box">box2</div>
        <div class="box orange-box">box3</div>
        <div class="box purple-box">box4</div>
        <div class="box green-box">box5</div>
        <div class="box">box6</div>
    </div>
</body>

</html>
