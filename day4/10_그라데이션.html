<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 500px;
            height: 500px;

        }
        .grad{
            background: orange;/* 그라데이션을 지원해주지 않는 브라우저에게 보여주는 색상 */
            background: linear-gradient(to left top, orange, white);
        }
        .grad2{
            background: orange;
            background: linear-gradient(270deg, orange, white);
        }
    </style>
</head>
<body>
    <div class="grad2"></div>
</body>
</html>
