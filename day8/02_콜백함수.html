<script>
    function test1(cb) {
        $.ajax({
            url: "http://192.168.30.57:3000/student",
            dataType: "json",
            type: "GET",
            data: {},
            success: function (data) {
                console.log(data);
                cb();
            }
        });
    }

    let test2 = function () {
        console.log('test2')
    }

    // 화살표 함수(Arrow Function)

        console.log('test3');
    }
    test2();
    test1(test3);
