<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>자바 수강생 모집</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 12px 20px;
        font-family: Arial, sans-serif;
        font-size: 16px;
    }

    .container {
        width: 852px;
        margin: 0 auto;
    }

    /* 제목 */
    .header {
        height: 108px;
        background-color: #4caf50;
        color: white;
        text-align: center;
        padding-top: 21px;
    }

    .header h1 {
        margin: 0;
        font-size: 28px;
    }

    .header p {
        margin: 5px 0 0;
        font-size: 21px;
        font-weight: bold;
    }

    /* 본문 */
    .content {
        margin-top: 17px;
        height: 788px;
        padding: 20px 18px;
        border-radius: 9px;
        box-shadow: 0 2px 10px #ccc;
    }

    .intro {
        font-size: 17px;
        font-weight: bold;
        line-height: 1.5;
    }

    .blue {
        color: blue;
    }

    .red {
        color: red;
    }

    /* 표 */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        font-size: 14px;
    }

    th, td {
        border: 1px solid #d5d5d5;
        height: 44px;
        padding: 8px;
    }

    th {
        width: 138px;
        background-color: #f3f3f7;
        text-align: center;
    }

    td {
        padding-left: 12px;
    }

    .notice {
        font-style: italic;
    }

    /* 혜택 */
    h3 {
        margin: 20px 0 10px;
        font-size: 18px;
    }

    ul {
        margin: 0;
        padding-left: 36px;
        font-size: 17px;
        line-height: 1.6;
    }

    /* 책 */
    .book {
        text-align: center;
        margin-top: 18px;
    }

    .book img {
        width: 270px;
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>자바 수강생 모집</h1>
        <p>자바에 관심 있는 새내기 여러분을 모집합니다.</p>
    </div>

    <div class="content">

        <div class="intro">
            교내 프로그래밍 동아리에서
            <span class="blue">신입생</span>을 대상으로 자바 수강생을 모집합니다.<br>

            <span class="red">학부나 전공에 상관없습니다.</span><br>

            평소 방송에 관심있었던 여러 학우들의 지원바랍니다.
        </div>

        <table>
            <tr>
                <th>모집 기간</th>
                <td>2월 5일 ~ 2월 11일</td>
            </tr>

            <tr>
                <th>모집 분야</th>
                <td>자바 기초, 자바 심화, 백엔드 입문</td>
            </tr>

            <tr>
                <th>지원 방법</th>
                <td>
                    양식 작성 후 이메일 접수<br>
                    <span class="notice">
                        지원서 양식은 교내 동아리 홈페이지 공지 게시판에 있습니다.
                    </span>
                </td>
            </tr>
        </table>

        <h3>혜택</h3>

        <ul>
            <li>아주 작은 소정의 활동비 지급</li>
            <li>주기적인 회식</li>
        </ul>

        <div class="book">
            <img src="../images/java_img.jpg" alt="자바 프로그래밍 입문">
        </div>

    </div>

</div>

</body>
</html>
