<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <label>텍스트 입력 : <input id="inputText"></label>
    </div>
    <div>
        <label>사이즈 입력 : <input id="inputSize" placeholder="px 단위"></label>
    </div>
    <div>
        <label>색상 입력 : <input id="inputColor" placeholder="red, green, blue 등 영어로"></label>
    </div>
    <div>
        <button onclick="fnString()">생성!</button>
    </div>
    <div id="result"></div>
</body>
</html>
<script>
    function fnString(){
        let text = document.querySelector(`#inputText`).value;
        let size = document.querySelector(`#inputSize`).value;
        let color = document.querySelector(`#inputColor`).value;
        document.querySelector(`#result`).innerHTML = `<span style='font-size:${size}px; color:${color}'>${text}</span>`;
        // let obj = document.querySelector(`#result`)
        // obj.style.fontSize = size+"px";
        // obj.style.color = color;
        // obj.innerHTML = text;

    }
</script>
