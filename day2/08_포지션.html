<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 150px;
            height: 150px;
            border: 2px solid black;
            text-align: center;
            line-height: 150px;
        }

        .box1 {
            background-color: antiquewhite;
        }

        /* 앱솔루트는 부모요소에 영향을 받아서 배치 */
        /* 부모 요소중에 static이 아닌 요소를 기준으로 배치 */
        /* 부모 요소중에 static이 아닌 요소가 업을 경우 body 태그 기준으로 배치 */
        /* 보통은 relative랑 조합해서 많이 사용된다. */
        .box2 {
            background-color: aqua;
            position: absolute;
            top: 30px;
            left: 50px;
        }

        .box3 {
            background-color: blueviolet;
            position: absolute;
            top: 100px;
            right: 50px;
        }
    </style>
</head>

<body>
    <div class="box1">box1</div>
    <div class="box2">box2</div>
    <div style="width: 800px; height: 500px; position: relative;">

        <div class="box3">box3</div>
    </div>
</body>

</html>
