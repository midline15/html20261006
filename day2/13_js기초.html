<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="fnAlert()">alert버튼</button>
    <button onclick="fnConfirm()">confirm버튼</button>
    <button onclick="fnPrompt()">prompt버튼</button>
</body>
</html>
<script>
    //변수
    //자바처럼 변수선언시 정수,실수,불린 등을 구분 안해도 된다.
    //let, var 에 다 담으면 되고
    //const 는 상수

    let a =30;
    let b = 30.5;
    let c = true;
    let d = "hello";
    let e = [1,3,5,7,9];
    let f = {
        name : "홍길동",
        age : 30
    };
    // let g = new date();
    let h = function(){
        alert("안녕");
    };

    function fnAlert(){
        alert("버튼을 눌렀어요!");
    };
    function fnConfirm(){
        //확인 취소 버튼
        //확인 true 취소 false 리턴
        //let result = confirm("정말 삭제???");
        if(confirm("정말 삭제???")){
            alert("삭제햇음")
        }
    };
    function fnPrompt(){
        //잘 안씀
        //값을 입력받을 수 있는 창
        let name = prompt("이름을 입력하세요");
        alert(name + "님 안녕하세요");

    };

    // console.log("안녕");
    let name = "홍길동";
    if(name == "홍길동"){
        console.log("참");
    }else{
        console.log("거짓")
    }

    let num = "10"
    if(num === 10){
        console.log("참");
    }else{
        console.log("거짓")
    }
    //== 값만 같다면 true === 값과 타입같아야 true
</script>
