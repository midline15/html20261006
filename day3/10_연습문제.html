<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            padding: 30px;
        }
        .box{
            width: 600px;
            height: 300px;
            border: 2px solid black;
            display: inline-block;
            box-sizing: border-box;
        }
        .box1{
            width: 50%;
            height: 100%;
            text-align: center;
            line-height: 2000%;
            box-sizing: border-box;
            background-size: contain;
            float: left;
            background-color: beige;
        }
        #dd{
            background-image: url('../images/01.jpg');
        }
        #ee{
            background-image: url('../images/02.jpg');
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="box1" id="dd"></div>
        <div class="box1">dfdf</div>
    </div>
    <div class="box">
        <div class="box1" id="ee"></div>
        <div class="box1">df</div>
    </div>
</body>
</html>
