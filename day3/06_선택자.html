<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 모든 div 태그 */
        div{
            color: orange;
        }
        /* 모든 div, span 태그 */
        div, span{
            font-size: 20px;
        }
        /* div 모든 하위 요소 중 span 태그 */
        div span{
            font-weight: bold;
        }
        /* div 바로 밑 span 태그 */
        div > span {
            font-style: italic;
        }
    </style>
</head>
<body>
    <div>
        <span>HTML 즐겁다~~~</span>
        <p>
            <span>javascrip도 재밌다~</span>
        </p>
    </div>
</body>
</html>
