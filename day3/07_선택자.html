<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* div태그 다음에 오는 첫번째 p태그에 적용. 같은 레벨*/
        div + p{
            color: orange;
        }
         /* div태그 다음에 오는 모든 p태그에 적용. 같은 레벨*/
        div ~ p{
            font-weight: bold;
        }
        /* id속성을 가진 p태그에 적용 */
        p[id]{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <p id="dfndvk">으으으팡ㅍ</p>
    <div>Hello Html</div>
    <p>볼드 오렌지</p>
    <p id="test">볼드 백그라운드</p>
    <div>
        <p>볼드 적용 안됨</p>
    </div>
    <p>볼드 오렌지</p>
</body>
</html>
