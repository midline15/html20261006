<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            width: 800px;
            border: 2px solid black;
            background-color: #eee;
            display: flex;
        }

        .box {
            width: 100px;
            margin: 10px;
            background-color: aqua;
            text-align: center;
        }

        .dir1 {
            /* default 왼쪽에서 오른쪽으로 정렬*/
            flex-direction: row;
        }
        .dir2 {
            /* 오른쪽에서 왼쪽으로 정렬*/
            flex-direction: row-reverse;
        }
        .dir3 {
            /* 위에서 아래로 정렬*/
            flex-direction: column;
        }
        .dir4 {
            /* 아래에서 위로 정렬*/
            flex-direction: column-reverse;
        }
    </style>
</head>

<body>
    <div id="container" class="dir4">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
</body>

</html>
